<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BioMation — Visualizing Biology</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/logo.png">
<meta name="description" content="BioMation translates advanced biological research into interactive digital experiences." />

<!-- React 18 -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel standalone for in-browser JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Three.js r128 + OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0a1e42;
    --blue-deep:#0d3b8c;
    --blue:#1a5fd6;
    --blue-bright:#2f7dff;
    --blue-pale:#eaf1ff;
    --ice:#f5f8ff;
    --white:#ffffff;
    --text:#0f1c33;
    --text-soft:#4a5a78;
    --line:#dce6f7;
    --shadow:0 20px 50px -20px rgba(13,59,140,0.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:var(--white);
    overflow-x:hidden;
  }
  h1,h2,h3,h4,.brand,.stat-num{font-family:'Space Grotesk',sans-serif;}
  a{text-decoration:none;color:inherit;}
  ::selection{background:var(--blue-bright);color:#fff;}

  /* ---------- Loader ---------- */
  #boot-loader{
    position:fixed;inset:0;background:var(--navy);z-index:9999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #boot-loader .ring{
    width:54px;height:54px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.15);
    border-top-color:#4f8dff;
    animation:spin 0.9s linear infinite;
  }
  #boot-loader p{color:#9fb8ec;font-family:'Space Grotesk',sans-serif;letter-spacing:.08em;font-size:13px;text-transform:uppercase;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Nav ---------- */
  header.site{
    position:fixed;top:0;left:0;right:0;z-index:500;
    background:rgba(255,255,255,0.82);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-bottom:1px solid var(--line);
    transition:box-shadow .3s ease;
  }
  header.site.menu-open{background:#fff;}
  header.site.scrolled{box-shadow:0 6px 24px -12px rgba(13,59,140,0.18);}
  .nav-inner{
    max-width:1240px;margin:0 auto;padding:16px 32px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--navy);}
  .brand-logo{height:38px;width:auto;display:block;}
  .brand-logo-badge{background:#fff;border-radius:12px;padding:5px 7px;display:inline-flex;}
  .brand-logo-badge .brand-logo{height:34px;}
  .contact-logo-badge{display:inline-flex;background:#fff;border-radius:18px;padding:12px 16px;margin-bottom:20px;box-shadow:0 10px 24px -12px rgba(0,0,0,0.5);}
  .contact-logo{height:64px;width:auto;display:block;}
  .brand .dot{
    width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));
    box-shadow:0 0 0 5px rgba(47,125,255,0.15);
  }
  nav.links{display:flex;gap:6px;align-items:center;}
  nav.links a{
    padding:9px 16px;border-radius:999px;font-size:14.5px;font-weight:500;
    color:var(--text-soft);transition:all .25s ease;position:relative;
  }
  nav.links a:hover{color:var(--blue-deep);background:var(--blue-pale);}
  nav.links a.active{color:#fff;background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));}
  .mobile-toggle{display:none;background:none;border:none;font-size:24px;color:var(--navy);cursor:pointer;}

  @media (max-width:860px){
    /* The header's backdrop blur makes it the containing block for this fixed panel,
       so size the panel explicitly from the header's bottom edge. */
    nav.links{
      position:absolute;top:100%;left:0;right:0;height:100vh;height:100dvh;overflow-y:auto;
      flex-direction:column;background:#fff;padding:20px 18px 120px;gap:10px;
      border-top:1px solid var(--line);
      transform:translateX(100%);transition:transform .35s ease, visibility 0s linear .35s;visibility:hidden;
    }
    nav.links.open{transform:translateX(0);visibility:visible;transition:transform .35s ease, visibility 0s;}
    nav.links a{width:100%;text-align:center;padding:15px;font-size:17px;font-weight:600;border-radius:14px;
      background:var(--ice);border:1px solid var(--line);color:var(--navy);}
    nav.links a.active{border-color:transparent;}
    .mobile-toggle{display:block;}
  }

  main{padding-top:66px;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;min-height:92vh;display:flex;align-items:center;
    background:radial-gradient(circle at 20% 20%, #123a8a 0%, var(--navy) 55%, #060f24 100%);
    overflow:hidden;color:#fff;
  }
  .hero-canvas{position:absolute;inset:0;opacity:.55;}
  .hero-inner{
    position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:80px 32px;
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;width:100%;
  }
  @media (max-width:900px){.hero-inner{grid-template-columns:1fr;}}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    background:rgba(79,141,255,0.15);color:#8fb4ff;border:1px solid rgba(79,141,255,0.35);
    margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(40px,6vw,68px);line-height:1.05;font-weight:700;margin-bottom:22px;
    background:linear-gradient(120deg,#ffffff, #bcd6ff 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.lead{font-size:18px;line-height:1.65;color:#c4d5f5;max-width:520px;margin-bottom:34px;}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    padding:14px 28px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;
    border:none;transition:all .25s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));color:#fff;box-shadow:0 12px 30px -10px rgba(47,125,255,0.6);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px -8px rgba(47,125,255,0.75);}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.25);}
  .btn-ghost:hover{background:rgba(255,255,255,0.16);}
  .btn-light{background:#fff;color:var(--blue-deep);}
  .btn-light:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,0.2);}
  .btn-outline{background:transparent;border:1.5px solid var(--blue);color:var(--blue-deep);}
  .btn-outline:hover{background:var(--blue-pale);}

  .hero-visual{
    position:relative;height:420px;border-radius:24px;overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.15);
  }

  .stats-strip{
    background:var(--navy);border-top:1px solid rgba(255,255,255,0.08);
    display:grid;grid-template-columns:repeat(3,1fr);
  }
  .stat{padding:26px 12px;text-align:center;color:#fff;border-right:1px solid rgba(255,255,255,0.08);}
  .stat:last-child{border-right:none;}
  .stat-num{font-size:28px;font-weight:700;color:#8fb4ff;}
  .stat-label{font-size:12.5px;color:#9fb0d4;margin-top:4px;letter-spacing:.03em;}
  @media (max-width:700px){.stats-strip{grid-template-columns:repeat(3,1fr);}}

  /* ---------- Sections generic ---------- */
  section{padding:100px 32px;}
  .container{max-width:1180px;margin:0 auto;}
  .section-head{max-width:680px;margin-bottom:56px;}
  .kicker{
    color:var(--blue);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;margin-bottom:14px;
  }
  .kicker::before{content:'';width:26px;height:2px;background:var(--blue);display:inline-block;}
  .section-head h2{font-size:clamp(28px,4vw,42px);font-weight:700;color:var(--navy);margin-bottom:16px;}
  .section-head p{color:var(--text-soft);font-size:16.5px;line-height:1.7;}

  .fade-up{opacity:0;transform:translateY(28px);transition:opacity .7s ease, transform .7s ease;}
  .fade-up.in{opacity:1;transform:translateY(0);}

  /* Vision/Mission cards */
  .vm-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media (max-width:800px){.vm-grid{grid-template-columns:1fr;}}
  .vm-card{
    padding:38px;border-radius:20px;background:var(--ice);border:1px solid var(--line);
    position:relative;overflow:hidden;transition:transform .3s ease, box-shadow .3s ease;
  }
  .vm-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);}
  .vm-card .icon{
    width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));color:#fff;font-size:22px;margin-bottom:20px;
  }
  .vm-card h3{font-size:21px;color:var(--navy);margin-bottom:12px;}
  .vm-card p{color:var(--text-soft);line-height:1.7;font-size:15.5px;}

  /* Pillars */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media (max-width:900px){.pillars{grid-template-columns:1fr;}}
  .pillar{
    padding:30px 26px;border-radius:18px;background:#fff;border:1px solid var(--line);
    transition:all .3s ease;
  }
  .pillar:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-4px);}
  .pillar .tag{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;}
  .pillar h4{font-size:19px;color:var(--navy);margin:10px 0 10px;}
  .pillar p{color:var(--text-soft);font-size:14.5px;line-height:1.6;}

  /* Enlarged "chain" version of the pillars, used on the About page */
  .pillars-chain{
    display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:0 18px;
  }
  @media (max-width:900px){.pillars-chain{grid-template-columns:1fr;gap:18px;}}
  .pillar-big{padding:42px 34px;border-radius:22px;box-shadow:0 12px 34px -18px rgba(13,59,140,0.18);}
  .pillar-big .tag{font-size:13px;}
  .pillar-big h4{font-size:24px;margin:14px 0 14px;}
  .pillar-big p{font-size:15.5px;line-height:1.75;}
  .chain-link{
    display:flex;align-items:center;justify-content:center;color:var(--blue-bright);
    font-size:30px;font-weight:700;
  }
  @media (max-width:900px){
    .chain-link{transform:rotate(90deg);font-size:24px;margin:-4px auto;}
  }

  /* ---------- Team ---------- */
  .team-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:44px;}
  .team-tab{
    padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
    font-weight:600;font-size:14px;cursor:pointer;color:var(--text-soft);transition:all .25s ease;
  }
  .team-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .team-tab:hover{border-color:var(--blue);}
  .team-group-desc{color:var(--text-soft);font-size:15px;margin-bottom:30px;max-width:640px;line-height:1.6;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;}
  .member-card{
    border-radius:20px;background:#fff;border:1px solid var(--line);overflow:hidden;
    transition:all .35s ease;
  }
  .member-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:transparent;}
  .member-photo{
    height:150px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;color:#fff;
    position:relative;
  }
  .member-body{padding:20px 22px 24px;}
  .member-body h4{font-size:17.5px;color:var(--navy);margin-bottom:2px;}
  .member-role{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:12px;}
  .member-body p{font-size:14px;color:var(--text-soft);line-height:1.6;}
  .member-lead{
    display:inline-block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.05em;
    color:#fff;background:linear-gradient(135deg,var(--blue-bright),var(--blue-deep));
    padding:4px 10px;border-radius:999px;text-transform:uppercase;
  }

  /* ---------- Projects ---------- */
  .project-tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:46px;}
  .project-tab{
    padding:12px 22px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
    cursor:pointer;font-weight:600;font-size:14.5px;color:var(--text-soft);
    display:flex;align-items:center;gap:10px;transition:all .25s ease;
  }
  .project-tab .swatch{width:10px;height:10px;border-radius:50%;}
  .project-tab.active{border-color:var(--blue);background:var(--blue-pale);color:var(--blue-deep);}
  .project-tab:hover{border-color:var(--blue);}

  .project-hero{
    display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;margin-bottom:64px;
  }
  @media (max-width:900px){.project-hero{grid-template-columns:1fr;}}
  .project-hero.hero-sim{grid-template-columns:2.2fr 1fr;gap:28px;align-items:stretch;}
  .project-hero.hero-sim .viewer-wrap{height:600px;}
  @media (max-width:900px){.project-hero.hero-sim{grid-template-columns:1fr;}.project-hero.hero-sim .viewer-wrap{height:min(640px,82vh);}}
  .fullscreen-note{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--blue-pale);border:1px solid var(--line);border-radius:14px;
    padding:12px 18px;margin:0 0 40px;color:var(--blue-deep);font-size:14.5px;
  }
  .first-project-note{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:space-between;margin-top:8px;
    background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow);}
  .first-project-note > div{flex:1 1 320px;min-width:0;}
  .first-project-note .fpn-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:6px;}
  .first-project-note p{color:var(--text-soft);font-size:15.5px;line-height:1.65;margin:0;}
  .first-project-note p b{color:var(--navy);}
  @media (max-width:600px){.first-project-note{padding:18px;}.first-project-note .btn{width:100%;justify-content:center;}}
  .fullscreen-note .note-link{background:none;border:none;padding:0;font:inherit;color:var(--blue-deep);font-weight:700;cursor:pointer;white-space:nowrap;}
  .fullscreen-note a{color:var(--blue-deep);font-weight:700;white-space:nowrap;}
  .project-status{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    padding:5px 12px;border-radius:999px;margin-bottom:16px;letter-spacing:.04em;text-transform:uppercase;
  }
  .status-active{background:#e4f7ea;color:#1c8a4a;}
  .status-progress{background:#fff3de;color:#b9770e;}
  .project-hero h2{font-size:clamp(30px,4vw,44px);color:var(--navy);margin-bottom:16px;}
  .project-hero .abstract{color:var(--text-soft);font-size:16px;line-height:1.75;margin-bottom:24px;}
  .project-expanded .abstract{color:var(--text-soft);font-size:16px;line-height:1.75;}
  .field-badges{display:flex;gap:8px;flex-wrap:wrap;}
  .field-badge{background:var(--blue-pale);color:var(--blue-deep);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;}

  .viewer-wrap{
    position:relative;border-radius:24px;overflow:hidden;
    background:linear-gradient(155deg,#0d1f45,#0a1530);
    border:1px solid var(--line);box-shadow:var(--shadow);height:420px;
  }
  .viewer-wrap canvas{display:block;width:100%!important;height:100%!important;}
  .viewer-hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    background:rgba(10,20,45,0.65);backdrop-filter:blur(6px);color:#cfe0ff;
    font-size:12px;padding:7px 16px;border-radius:999px;letter-spacing:.02em;
    display:flex;align-items:center;gap:6px;
  }
  .viewer-badge{
    position:absolute;top:16px;left:16px;background:rgba(47,125,255,0.18);
    border:1px solid rgba(79,141,255,0.4);color:#a9c6ff;font-size:11.5px;font-weight:700;
    padding:5px 12px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;
  }

  .subsection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:8px;}
  @media (max-width:900px){.subsection-grid{grid-template-columns:1fr;}}
  .subsection-grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.subsection-grid-2{grid-template-columns:1fr;}}

  /* ---------- Expand-in-place project view ---------- */
  .project-cards-grid .project-expanded{grid-column:1/-1;}
  .back-to-projects{
    display:inline-flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
    color:var(--blue-deep);font-weight:700;font-size:14.5px;padding:0;margin-bottom:28px;
    transition:transform .2s ease;
  }
  .back-to-projects:hover{transform:translateX(-3px);}
  .summary-card{
    background:var(--ice);border:1px solid var(--line);border-radius:24px;padding:30px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .article-tile{
    display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:14px 16px;text-align:left;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:14px;font:inherit;color:var(--navy);
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .article-tile:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(13,59,140,0.35);}
  .article-tile .at-ico{font-size:24px;flex:none;}
  .article-tile .at-kicker{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:3px;}
  .article-tile .at-title{display:block;font-weight:700;font-size:14.5px;line-height:1.35;}
  .article-tile .at-by{display:block;font-size:12.5px;color:var(--text-soft);margin-top:4px;line-height:1.4;}
  .article-tile .at-by + .at-by{margin-top:1px;}
  .article-tile .at-go{margin-left:auto;font-weight:700;color:var(--blue-deep);flex:none;}
  .article-link{background:none;border:none;padding:0;font:inherit;color:var(--blue-deep);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;}
  .article-modal{position:fixed;inset:0;z-index:1000;background:rgba(8,18,40,0.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;}
  .article-panel{background:#fff;width:min(880px,100%);height:min(88vh,1000px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,0.5);}
  .article-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex:none;}
  .article-head .ah-text{min-width:0;margin-right:auto;}
  .article-head .ah-kicker{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-deep);}
  .article-head .ah-by{font-size:13.5px;color:var(--text-soft);margin-top:4px;}
  .article-head .ah-by + .ah-by{margin-top:1px;}
  .article-head h3{font-size:18px;color:var(--navy);margin:2px 0 0;line-height:1.3;}
  .article-head .btn-sm{flex:none;font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;text-decoration:none;white-space:nowrap;}
  .article-head .btn-sm:hover{border-color:var(--blue);}
  .article-head .btn-close{background:var(--navy);color:#fff;border-color:var(--navy);}
  .article-body{overflow-y:auto;padding:28px 36px 40px;color:#23324a;font-size:16.5px;line-height:1.8;}
  .article-body p{margin:0 0 18px;}
  .article-body h5{color:var(--navy);font-size:19px;margin:28px 0 10px;line-height:1.35;}
  .article-body h5:first-child{margin-top:0;}

  /* ---------- Avatar (upload-capable) ---------- */

  .avatar-wrap > img, .avatar-wrap > span{

  /* ---------- Edit mode ---------- */

  .edit-toolbar{

<body>

<div id="boot-loader"><div class="ring"></div><p>Loading BioMation</p></div>
<div id="root"></div>

<script src="team-data.js"></script>
<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback, useContext } = React;

/* ================= EDIT MODE / PERSISTENCE ================= */

const LS_TEXT = "biomation_text_overrides";
const LS_IMG = "biomation_image_overrides";
const LS_MODEL = "biomation_model_overrides";
const LS_FILES = "biomation_file_overrides";
const EDIT_PASSWORD = "biomation2026";
const MAX_EMBED_BYTES = 3 * 1024 * 1024; // ~3MB safe ceiling for localStorage-embedded files

// Overrides baked into the file at export time (visible to every visitor, no login needed)
const BAKED = (typeof window !== "undefined" && window.__BIOMATION_OVERRIDES__) || { text: {}, images: {}, models: {}, files: {} };

function isAdminUrl(){
  try{
    const params = new URLSearchParams(window.location.search);
    return params.get("admin") === "1" || window.location.hash.indexOf("admin=1") !== -1;
  }catch(e){ return false; }
}

function getLocalTextOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_TEXT) || "{}"); }catch(e){ return {}; } }
function getLocalImageOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_IMG) || "{}"); }catch(e){ return {}; } }
function getLocalModelOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_MODEL) || "{}"); }catch(e){ return {}; } }
function getLocalFileOverrides(){ try{ return JSON.parse(localStorage.getItem(LS_FILES) || "{}"); }catch(e){ return {}; } }

function saveLocalTextOverride(key, html){ const o = getLocalTextOverrides(); o[key] = html; localStorage.setItem(LS_TEXT, JSON.stringify(o)); }
function saveLocalImageOverride(key, dataUrl){ const o = getLocalImageOverrides(); o[key] = dataUrl; localStorage.setItem(LS_IMG, JSON.stringify(o)); }
function saveLocalModelOverride(key, modelObj){ const o = getLocalModelOverrides(); o[key] = modelObj; localStorage.setItem(LS_MODEL, JSON.stringify(o)); }
function clearLocalModelOverride(key){ const o = getLocalModelOverrides(); delete o[key]; localStorage.setItem(LS_MODEL, JSON.stringify(o)); }
function saveLocalFileList(key, list){ const o = getLocalFileOverrides(); o[key] = list; localStorage.setItem(LS_FILES, JSON.stringify(o)); }

function resolveText(key, fallback){
  const local = getLocalTextOverrides();
  if(local[key] !== undefined) return local[key];
  if(BAKED.text && BAKED.text[key] !== undefined) return BAKED.text[key];
  return fallback;
}
function resolveImage(key){
  const local = getLocalImageOverrides();
  if(local[key] !== undefined) return local[key];
  if(BAKED.images && BAKED.images[key] !== undefined) return BAKED.images[key];
  return null;
}
function resolveModel(key){
  const local = getLocalModelOverrides();
  if(local[key] !== undefined) return local[key];
  if(BAKED.models && BAKED.models[key] !== undefined) return BAKED.models[key];
  return null;
}
function getFilesFor(key){
  const local = getLocalFileOverrides();
  if(local[key] !== undefined) return local[key];
  if(BAKED.files && BAKED.files[key] !== undefined) return BAKED.files[key];
  return [];
}
function addFile(key, fileObj){
  const list = getFilesFor(key).slice();
  list.push(fileObj);
  saveLocalFileList(key, list);
}
function removeFileAt(key, index){
  const list = getFilesFor(key).slice();
  list.splice(index, 1);
  saveLocalFileList(key, list);
}

const EditModeContext = React.createContext({ editMode: false, setEditMode: () => {} });
function useEditMode(){ return useContext(EditModeContext); }

function FileListSection({ storageKey, emptyLabel = "Nothing uploaded yet." }){
  const { editMode } = useEditMode();
  const [files, setFiles] = useState(() => getFilesFor(storageKey));
  const [linkName, setLinkName] = useState("");
  const [linkUrl, setLinkUrl] = useState("");
  const inputRef = useRef(null);

  const refresh = () => setFiles(getFilesFor(storageKey));

  const onUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(file.size > MAX_EMBED_BYTES){
      alert("\"" + file.name + "\" is " + Math.round(file.size/1024/1024) + "MB — too big to save directly in the browser. Upload it to Google Drive/Dropbox instead, then paste the share link below.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { addFile(storageKey, { name: file.name, kind: "embedded", value: reader.result, addedAt: Date.now() }); refresh(); };
    reader.readAsDataURL(file);
  };

  const onAddLink = () => {
    if(!linkUrl.trim()) return;
    addFile(storageKey, { name: linkName.trim() || linkUrl.trim(), kind: "url", value: linkUrl.trim(), addedAt: Date.now() });
    setLinkName(""); setLinkUrl("");
    refresh();
  };

  const onRemove = (i) => { removeFileAt(storageKey, i); refresh(); };

  if(!editMode && files.length === 0) return null; // nothing to show visitors

  return (
    <React.Fragment>
      {files.length > 0 && (
        <ul style={{ marginTop: 10 }}>
          {files.map((f, i) => (
            <li key={i} style={{ justifyContent: "space-between" }}>
              <a href={f.value} target="_blank" rel="noopener noreferrer" download={f.kind === "embedded" ? f.name : undefined} style={{ color: "var(--blue-deep)", fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis" }}>{f.name}</a>
              {editMode && <button type="button" onClick={() => onRemove(i)} style={{ border: "none", cursor: "pointer", background: "#ffe1e6", color: "#c23350", fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 999 }}>Remove</button>}
            </li>
          ))}
        </ul>
      )}
      {files.length === 0 && !editMode && <div className="empty">{emptyLabel}</div>}
      {editMode && (
        <div style={{ marginTop: 14, padding: 12, background: "#fff", border: "1px dashed var(--line)", borderRadius: 10 }}>

function ModelSourceControl({ modelKey }){
  const { editMode } = useEditMode();
  const inputRef = useRef(null);
  const [url, setUrl] = useState("");
  const current = resolveModel(modelKey);

  if(!editMode) return null;

  const notify = () => window.dispatchEvent(new CustomEvent("biomation-model-updated", { detail: modelKey }));

  const onUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(file.size > MAX_EMBED_BYTES){
      alert("That model is " + Math.round(file.size/1024/1024) + "MB — too big to save directly in the browser. Host the .glb/.gltf somewhere (Drive/Dropbox/GitHub) and paste a direct link below instead.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => { saveLocalModelOverride(modelKey, { kind: "embedded", value: reader.result }); notify(); };
    reader.readAsDataURL(file);
  };

  const onSetUrl = () => {
    if(!url.trim()) return;
    saveLocalModelOverride(modelKey, { kind: "url", value: url.trim() });
    notify();
  };

  const onClear = () => { clearLocalModelOverride(modelKey); notify(); };

  return (
    <div style={{ marginTop: 14, padding: 14, background: "rgba(255,255,255,0.08)", borderRadius: 12 }}>
      <div style={{ color: "#cfe0ff", fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>
        {current ? "✓ Using your uploaded model" : "Swap in your real CAD / simulation model (.glb or .gltf)"}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button type="button" className="et-btn" onClick={() => inputRef.current && inputRef.current.click()}>⬆ Upload .glb (&lt;3MB)</button>
        <input ref={inputRef} type="file" accept=".glb,.gltf" style={{ display: "none" }} onChange={onUpload} />
        <input placeholder="or paste a hosted .glb/.gltf URL" value={url} onChange={e => setUrl(e.target.value)} style={{ flex: "1 1 200px", padding: "8px 10px", borderRadius: 8, border: "none", fontSize: 13 }} />
        <button type="button" className="et-btn" onClick={onSetUrl}>Use link</button>
        {current && <button type="button" className="et-btn danger" onClick={onClear}>Reset to placeholder</button>}
      </div>
    </div>
  );
}

function EditableText({ id, as: Tag = "div", className = "", html, style }){
  const { editMode } = useEditMode();
  const ref = useRef(null);
  const [content, setContent] = useState(() => resolveText(id, html));

  useEffect(() => { if(ref.current) ref.current.contentEditable = editMode ? "true" : "false"; }, [editMode]);

  const onBlur = () => {
    if(!ref.current) return;
    const newHtml = ref.current.innerHTML;
    setContent(newHtml);
    saveLocalTextOverride(id, newHtml);
  };

  return (
    <Tag
      ref={ref}
      data-edit-key={id}
      className={className + (editMode ? " editable-active" : "")}
      style={style}
      onBlur={onBlur}
      suppressContentEditableWarning={true}
      dangerouslySetInnerHTML={{ __html: content }}
    />
  );
}

  const { editMode } = useEditMode();
  const [imgSrc, setImgSrc] = useState(() => resolveImage(editKey) || photo || null);
  const inputRef = useRef(null);

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setImgSrc(reader.result);
      saveLocalImageOverride(editKey, reader.result);

  };

  return (
    <div className="avatar-wrap" style={{ width: size, height: size, fontSize: size * 0.36, background: imgSrc ? photoBg : `linear-gradient(135deg, ${gradientFrom}, ${gradientTo})` }}>
      {imgSrc ? <img src={imgSrc} alt={name} /> : <span>{fallbackInitials}</span>}
      {editMode && (

function exportSite(){
  const mergedText = { ...(BAKED.text || {}), ...getLocalTextOverrides() };
  const mergedImages = { ...(BAKED.images || {}), ...getLocalImageOverrides() };
  const mergedModels = { ...(BAKED.models || {}), ...getLocalModelOverrides() };
  const mergedFiles = { ...(BAKED.files || {}), ...getLocalFileOverrides() };
  const overrideScript = `window.__BIOMATION_OVERRIDES__ = ${JSON.stringify({ text: mergedText, images: mergedImages, models: mergedModels, files: mergedFiles })};`;

  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll("[data-edit-key]").forEach(el => { el.removeAttribute("contenteditable"); el.classList.remove("editable-active"); });
  clone.querySelectorAll(".edit-toolbar").forEach(el => el.remove());

  let existing = clone.querySelector("#biomation-overrides-script");
  if(!existing){
    existing = document.createElement("script");
    existing.id = "biomation-overrides-script";
    const babelScript = clone.querySelector('script[type="text/babel"]');
    babelScript.parentNode.insertBefore(existing, babelScript);
  }
  existing.textContent = overrideScript;

  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([html], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function resetLocalEdits(){
  localStorage.removeItem(LS_TEXT);
  localStorage.removeItem(LS_IMG);
  localStorage.removeItem(LS_MODEL);
  localStorage.removeItem(LS_FILES);
  location.reload();
}

function EditToolbar(){
  const { editMode, setEditMode } = useEditMode();

  // Never shown to regular visitors — only appears when the URL has ?admin=1,
  // so the public biomation.com site stays clean.
  if(!isAdminUrl()) return null;

  const toggle = () => {
    if(editMode){ setEditMode(false); return; }
    const pass = window.prompt("Enter the edit password to unlock editing:");
    if(pass === null) return;
    if(pass === EDIT_PASSWORD) setEditMode(true);
    else alert("Incorrect password.");
  };

  return (
    <div className="edit-toolbar">
      <button className={"et-btn" + (editMode ? " active" : "")} onClick={toggle}>{editMode ? "🔓 Editing ON" : "🔒 Edit Site"}</button>
      {editMode && (
        <React.Fragment>
          <span className="et-hint">Click highlighted text/photos to edit · use the upload panels on Projects to add files &amp; models</span>
          <button className="et-btn" onClick={exportSite}>⬇ Export Updated Site</button>
          <button className="et-btn danger" onClick={resetLocalEdits}>Reset My Edits</button>
        </React.Fragment>
      )}
    </div>
  );
}

function useReveal(){
  useEffect(() => {
    const els = document.querySelectorAll(".fade-up:not(.in)");
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); obs.unobserve(e.target); } });
    }, { threshold: 0.15 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

function buildHelix({ turns = 4, pointsPerTurn = 14, radius = 1.4, height = 6, sphereSize = 0.16, rungSize = 0.045 } = {}){
  const helix = new THREE.Group();
  const matA = new THREE.MeshStandardMaterial({ color: 0x2f7dff, roughness:0.35, metalness:0.2, emissive:0x0a1e42, emissiveIntensity:0.15 });
  const matB = new THREE.MeshStandardMaterial({ color: 0x00e0c6, roughness:0.35, metalness:0.2, emissive:0x0a1e42, emissiveIntensity:0.15 });
  const rungMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness:0.5, metalness:0.1 });
  const total = turns * pointsPerTurn;
  const sphGeo = new THREE.SphereGeometry(sphereSize, 16, 16);
  const steps = []; // one entry per "layer" so callers can reveal the strand progressively
  for(let i=0;i<total;i++){
    const t = i / pointsPerTurn * Math.PI * 2;
    const y = (i/total) * height - height/2;
    const x1 = Math.cos(t) * radius, z1 = Math.sin(t) * radius;
    const x2 = Math.cos(t + Math.PI) * radius, z2 = Math.sin(t + Math.PI) * radius;
    const step = new THREE.Group();
    const s1 = new THREE.Mesh(sphGeo, matA); s1.position.set(x1,y,z1); step.add(s1);
    const s2 = new THREE.Mesh(sphGeo, matB); s2.position.set(x2,y,z2); step.add(s2);
    if(i % 2 === 0){
      const dist = Math.hypot(x2-x1, z2-z1);
      const rungGeo = new THREE.CylinderGeometry(rungSize, rungSize, dist, 8);
      const rung = new THREE.Mesh(rungGeo, rungMat);
      rung.position.set((x1+x2)/2, y, (z1+z2)/2);
      rung.lookAt(new THREE.Vector3(x2,y,z2));
      rung.rotateX(Math.PI/2);
      step.add(rung);
    }
    helix.add(step);
    steps.push(step);
  }
  helix.userData.steps = steps;
  return helix;
}

function buildModel(type){
  const group = new THREE.Group();

  if(type === "helix"){
    group.add(buildHelix({ turns: 4, pointsPerTurn: 14, radius: 1.4, height: 6, sphereSize: 0.16, rungSize: 0.045 }));
  }

  if(type === "cell"){
    const membrane = new THREE.Mesh(
      new THREE.SphereGeometry(2.1, 48, 48),
      new THREE.MeshPhysicalMaterial({ color:0x2f7dff, transparent:true, opacity:0.18, roughness:0.1, transmission:0.6, thickness:0.5 })
    );
    group.add(membrane);
    const wire = new THREE.Mesh(new THREE.SphereGeometry(2.1,24,24), new THREE.MeshBasicMaterial({color:0x8fb4ff, wireframe:true, transparent:true, opacity:0.25}));
    group.add(wire);
    const nucleus = new THREE.Mesh(new THREE.SphereGeometry(0.75,32,32), new THREE.MeshStandardMaterial({color:0x7c5cff, roughness:0.4, emissive:0x2a1a6b, emissiveIntensity:0.3}));
    nucleus.position.set(0.2,0.1,0.3);
    group.add(nucleus);
    const colors = [0x00e0c6, 0xff9d4d, 0xff5c7c, 0xffe14d];
    for(let i=0;i<10;i++){
      const geo = new THREE.SphereGeometry(0.15 + Math.random()*0.15, 12, 12);
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: colors[i % colors.length], roughness:0.4}));
      const r = 1.1 + Math.random()*0.7;
      const theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
      mesh.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
      group.add(mesh);
    }
  }

  if(type === "neuron"){
    const soma = new THREE.Mesh(new THREE.SphereGeometry(0.65,32,32), new THREE.MeshStandardMaterial({color:0x7c5cff, roughness:0.4, emissive:0x2a1a6b, emissiveIntensity:0.25}));
    group.add(soma);
    const axonCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.5,-0.1,0), new THREE.Vector3(1.6,-0.5,0.3), new THREE.Vector3(2.8,-0.3,-0.2), new THREE.Vector3(4,-0.6,0.4)
    ]);
    const axonGeo = new THREE.TubeGeometry(axonCurve, 40, 0.14, 8, false);
    const axon = new THREE.Mesh(axonGeo, new THREE.MeshStandardMaterial({color:0x2f7dff, roughness:0.4}));
    group.add(axon);
    const terminalTips = [new THREE.Vector3(4.3,-0.9,0.7), new THREE.Vector3(4.4,-0.2,0.9), new THREE.Vector3(4.2,-0.6,-0.1)];
    terminalTips.forEach(tip => {
      const geo = new THREE.SphereGeometry(0.14,12,12);
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0x00e0c6}));
      mesh.position.copy(tip);
      group.add(mesh);
      const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(4,-0.6,0.4), tip]);
      const branch = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.05, 6, false), new THREE.MeshStandardMaterial({color:0x2f7dff}));
      group.add(branch);
    });
    for(let i=0;i<7;i++){
      const angle = (i/7) * Math.PI * 2;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(Math.cos(angle)*0.9, Math.sin(angle)*0.6+0.3, Math.sin(angle)*0.7),
        new THREE.Vector3(Math.cos(angle)*1.6, Math.sin(angle)*1.1+0.4, Math.sin(angle)*1.2)
      ]);
      const dendrite = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.06, 6, false), new THREE.MeshStandardMaterial({color:0x9c8bff}));
      group.add(dendrite);
    }
    group.position.x = -1.2;
  }

  if(type === "heart"){
    const matHeart = new THREE.MeshStandardMaterial({color:0xff5c7c, roughness:0.35, metalness:0.1});
    const left = new THREE.Mesh(new THREE.SphereGeometry(1.05,32,32), matHeart);
    left.position.set(-0.55,0.1,0); left.scale.set(1,1.2,1);
    const right = new THREE.Mesh(new THREE.SphereGeometry(0.95,32,32), matHeart);
    right.position.set(0.55,0.25,0); right.scale.set(1,1.15,1);
    const bottom = new THREE.Mesh(new THREE.ConeGeometry(1.05,1.8,32), matHeart);
    bottom.position.set(0,-1.2,0); bottom.rotation.x = Math.PI;
    group.add(left, right, bottom);
    const aortaCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,1.1,0), new THREE.Vector3(0.3,1.7,0), new THREE.Vector3(1.1,1.9,0), new THREE.Vector3(1.6,1.5,0)
    ]);
    const aorta = new THREE.Mesh(new THREE.TubeGeometry(aortaCurve,20,0.28,10,false), new THREE.MeshStandardMaterial({color:0xffb3c2, roughness:0.4}));
    group.add(aorta);
    const veinCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.9,1.2,0.2), new THREE.Vector3(-1.4,1.7,0.1), new THREE.Vector3(-1.9,1.5,-0.1)
    ]);
    const vein = new THREE.Mesh(new THREE.TubeGeometry(veinCurve,20,0.22,10,false), new THREE.MeshStandardMaterial({color:0x6a8dff, roughness:0.4}));
    group.add(vein);
  }

  if(type === "helix-robot"){
    // A 3D printer for DNA: a fixed central rail, and a print head that
    // spirals smoothly up it, tracing the exact path of the helix and
    // depositing each piece as it passes. No flailing joints — just one
    // continuous, predictable motion, like watching a printer work.
    const rigMat = new THREE.MeshStandardMaterial({ color: 0xe8edf7, roughness: 0.3, metalness: 0.7 });
    const rigMatDark = new THREE.MeshStandardMaterial({ color: 0x8fa3c9, roughness: 0.35, metalness: 0.6 });
    const nozzleMat = new THREE.MeshStandardMaterial({ color: 0x2f7dff, roughness: 0.2, metalness: 0.5, emissive: 0x0a1e42, emissiveIntensity: 0.4 });

    const turns = 2.6, radius = 0.55, height = 3.2;
    const rigGroup = new THREE.Group();

    // print bed
    const bed = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.55, radius + 0.65, 0.16, 32), rigMatDark);
    bed.position.y = -height / 2 - 0.22;
    rigGroup.add(bed);

    // central rail the print head rides on
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, height + 1.5, 12), rigMat);
    rigGroup.add(rail);

    // motor housing capping the top of the rail
    const capBase = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.3, 16), rigMat);
    capBase.position.y = height / 2 + 0.6;
    rigGroup.add(capBase);
    const capTop = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.32), rigMatDark);
    capTop.position.y = height / 2 + 0.82;
    rigGroup.add(capTop);

    // orbiter: rotates around the rail while climbing it, carrying the print head
    const orbiter = new THREE.Group();
    orbiter.position.y = -height / 2;
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(radius + 0.2, 0.05, 0.05), rigMat);
    bracket.position.x = (radius + 0.2) / 2;
    orbiter.add(bracket);

    const nozzle = new THREE.Group();
    nozzle.position.set(radius + 0.08, 0, 0);
    const nozzleBody = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.18, 12), nozzleMat);
    nozzle.add(nozzleBody);
    const nozzleTip = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.12, 12), nozzleMat);
    nozzleTip.position.y = -0.15;
    nozzleTip.rotation.x = Math.PI;
    nozzle.add(nozzleTip);
    orbiter.add(nozzle);
    rigGroup.add(orbiter);

    group.add(rigGroup);

    // the DNA strand being printed — same turns/radius/height as the rail path,
    // so the nozzle traces it exactly
    const strand = buildHelix({ turns, pointsPerTurn: 12, radius, height, sphereSize: 0.1, rungSize: 0.032 });
    group.add(strand);

    group.userData.armRefs = { helixSteps: strand.userData.steps, orbiter, nozzle, turns, height };
    group.position.set(0, 0.6, 0);
  }

  return group;
}

function ThreeViewer({ type, height = 420, autoRotate = true, interactive = true, modelKey = null }){
  const mountRef = useRef(null);
  const [tick, setTick] = useState(0);
  const [loadError, setLoadError] = useState(false);

  // re-run the viewer whenever this project's uploaded/linked model changes
  useEffect(() => {
    if(!modelKey) return;
    const handler = (e) => { if(e.detail === modelKey) setTick(t => t + 1); };
    window.addEventListener("biomation-model-updated", handler);
    return () => window.removeEventListener("biomation-model-updated", handler);
  }, [modelKey]);

  useEffect(() => {
    const mount = mountRef.current;
    if(!mount) return;
    let disposed = false;
    setLoadError(false);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, mount.clientWidth / mount.clientHeight, 0.1, 100);
    camera.position.set(0, 0.6, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    mount.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x8fb4ff, 0.7);
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(4,5,6);
    const rim = new THREE.DirectionalLight(0x2f7dff, 0.6);
    rim.position.set(-5,-3,-4);
    scene.add(ambient, key, rim);

    let controls = null;
    let frameId = null;
    let ro = null;
    let model = null;

    const startLoop = () => {
      const armRefs = model.userData.armRefs;
      const animate = () => {
        frameId = requestAnimationFrame(animate);
        if(controls) controls.update();
        else model.rotation.y += 0.004;
        if(armRefs && armRefs.helixSteps && armRefs.helixSteps.length){
          const t = performance.now() * 0.001;
          const total = armRefs.helixSteps.length;
          const cyclePeriod = 6.5; // slow, deliberate — like watching a real print job
          const holdFraction = 0.12; // brief pause at the top before resetting, like a finished print
          const raw = (t % cyclePeriod) / cyclePeriod;
          const phase = Math.min(raw / (1 - holdFraction), 1); // ease into the hold, no snap-back

          const revealCount = Math.max(1, Math.ceil(phase * total));
          for(let i = 0; i < total; i++) armRefs.helixSteps[i].visible = i < revealCount;

          if(armRefs.orbiter){
            // pure, constant-speed spiral — no bob, no wobble, just a steady climb
            const totalAngle = armRefs.turns * Math.PI * 2;
            armRefs.orbiter.rotation.y = totalAngle * phase;
            armRefs.orbiter.position.y = -armRefs.height / 2 + phase * armRefs.height;
          }
        }
        renderer.render(scene, camera);
      };
      animate();

      const onResize = () => {
        if(!mount) return;
        camera.aspect = mount.clientWidth / mount.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(mount.clientWidth, mount.clientHeight);
      };
      ro = new ResizeObserver(onResize);
      ro.observe(mount);
    };

    const placeModel = (obj, { fit = false } = {}) => {
      if(disposed) return;
      model = obj;
      if(fit){
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3(); box.getSize(size);
        const center = new THREE.Vector3(); box.getCenter(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = 3.4 / maxDim;
        model.scale.setScalar(scale);
        model.position.x -= center.x * scale;
        model.position.y -= center.y * scale;
        model.position.z -= center.z * scale;
      }
      scene.add(model);
      if(interactive && THREE.OrbitControls){
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = autoRotate;
        controls.autoRotateSpeed = 1.6;
        controls.enableZoom = true;
        controls.minDistance = 1.5;
        controls.maxDistance = 16;
      }
      startLoop();
    };

    const override = modelKey ? resolveModel(modelKey) : null;

    if(override && override.value && THREE.GLTFLoader){
      const loader = new THREE.GLTFLoader();
      const onError = (err) => {
        console.warn("BioMation: couldn't load custom model, falling back to placeholder.", err);
        if(!disposed){ setLoadError(true); placeModel(buildModel(type), { fit: false }); }
      };
      if(override.kind === "url"){
        loader.load(override.value, (gltf) => placeModel(gltf.scene, { fit: true }), undefined, onError);
      } else {
        fetch(override.value).then(r => r.arrayBuffer()).then(buf => {
          loader.parse(buf, "", (gltf) => placeModel(gltf.scene, { fit: true }), onError);
        }).catch(onError);
      }
    } else {
      placeModel(buildModel(type), { fit: false });
    }

    return () => {
      disposed = true;
      if(frameId) cancelAnimationFrame(frameId);
      if(ro) ro.disconnect();
      if(controls) controls.dispose();
      renderer.dispose();
      if(mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, [type, tick, modelKey]);

  return (
    <div style={{ position: "relative", width: "100%", height: height + "px" }}>
      <div ref={mountRef} style={{ width: "100%", height: "100%" }} />
      {loadError && (
        <div style={{ position: "absolute", top: 10, left: 10, background: "rgba(255,92,124,0.15)", border: "1px solid rgba(255,92,124,0.4)", color: "#ffb3c2", fontSize: 11.5, padding: "5px 10px", borderRadius: 999 }}>
          Couldn't load that model — showing placeholder
        </div>
      )}
    </div>
  );
}

function initials(name){ return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase(); }
function colorFor(str){
  const palette = ["#2f7dff","#7c5cff","#00b3a4","#ff5c7c","#ff9d4d","#0d3b8c","#1c8a4a"];
  let hash = 0; for(let i=0;i<str.length;i++) hash = str.charCodeAt(i) + ((hash<<5)-hash);
  return palette[Math.abs(hash) % palette.length];
}

// Put the embedded simulation into real fullscreen (landscape on phones). Browsers
// without element fullscreen (e.g. iPhone Safari) open it in a new tab instead.
function launchSimulation(url){
  const frame = document.querySelector("iframe.sim-frame");
  const req = frame && (frame.requestFullscreen || frame.webkitRequestFullscreen);
  if(!req){ window.open(url, "_blank", "noopener"); return; }
  Promise.resolve(req.call(frame)).then(() => {
    try { const o = screen.orientation; if(o && o.lock) o.lock("landscape").catch(() => {}); } catch(e){}
  }).catch(() => window.open(url, "_blank", "noopener"));
}

// Tell the simulation when it enters/leaves fullscreen, and handle its "exit" request.
function useSimFullscreenBridge(){
  useEffect(() => {
    const frameEl = () => document.querySelector("iframe.sim-frame");
    const onChange = () => {
      const f = frameEl(); if(!f || !f.contentWindow) return;
      const on = (document.fullscreenElement || document.webkitFullscreenElement) === f;
      f.contentWindow.postMessage({ type: "bm-fullscreen", on }, "*");
      if(!on){ try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch(e){} }
    };
    const onMsg = (e) => {
      if(e.data && e.data.type === "bm-exit-fullscreen" && (document.fullscreenElement || document.webkitFullscreenElement)){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    };
    document.addEventListener("fullscreenchange", onChange);
    document.addEventListener("webkitfullscreenchange", onChange);
    window.addEventListener("message", onMsg);
    return () => {
      document.removeEventListener("fullscreenchange", onChange);
      document.removeEventListener("webkitfullscreenchange", onChange);
      window.removeEventListener("message", onMsg);
    };
  }, []);
}

const WEB3FORMS_KEY = "98b3d5c6-d122-4bf2-b70e-d5c61ec03038";

function Contact(){
  useReveal();
  const [status, setStatus] = useState("idle"); // idle | sending | sent | error
  const onSubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form).entries());
    if (data._honey) return; // spam bot filled the hidden field
    setStatus("sending");
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000); // never leave the button stuck
    const subject = "BioMation website message: " + data.topic + " from " + data.first_name + " " + data.last_name;
    try {
      const res = WEB3FORMS_KEY
        ? await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            signal: controller.signal,
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
              access_key: WEB3FORMS_KEY,
              subject,
              from_name: "BioMation Website",
              replyto: data.email,
              Name: data.first_name + " " + data.last_name,
              Email: data.email,
              Topic: data.topic,
              Message: data.message,
            }),
          })
        : await fetch("https://formsubmit.co/ajax/b29b7a32f6f784fbbd0f88b16296b247", {
            method: "POST",
            signal: controller.signal,
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
              _subject: subject,
              _replyto: data.email,
              _template: "table",
              Name: data.first_name + " " + data.last_name,
              Email: data.email,
              Topic: data.topic,
              Message: data.message,
            }),
          });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || out.success === false || out.success === "false") throw new Error(out.message || "Send failed");
      setStatus("sent");
      form.reset();
      setTimeout(() => setStatus("idle"), 6000);
    } catch (err) {
      setStatus("error");
    } finally {
      clearTimeout(timer);
    }
  };

  return (
    <div className="page-enter">
      <section style={{paddingTop:64, paddingBottom:40, background:"linear-gradient(180deg, var(--blue-pale), #fff)"}}>
        <div className="container">
          <div className="section-head fade-up">

            <p>Questions about a project, interested in joining a team, or want to collaborate? Reach out below.</p>
          </div>
        </div>
      </section>
      <section style={{paddingTop:0}}>
        <div className="container">
          <div className="contact-grid">
            <div className="contact-info-card fade-up">
              <span className="contact-logo-badge"><img src="images/logo.png" alt="BioMation logo" className="contact-logo" /></span>
              <h3>Get in touch</h3>
              <p>We love hearing from educators, students, and fellow builders.</p>
              <div className="contact-row">
                <div className="ico">✉</div>
                <div><h5>Email</h5><p><a href="mailto:biomation12@gmail.com" style={{color:"inherit", textDecoration:"none"}}>biomation12@gmail.com</a></p></div>
              </div>
              <div className="contact-row">
                <div className="ico">📸</div>
                <div><h5>Instagram</h5><p><a href="https://www.instagram.com/bio_mation1" target="_blank" rel="noopener noreferrer" style={{color:"inherit", textDecoration:"none"}}>@bio_mation1</a></p></div>
              </div>
              <div className="social-row">
                <a href="https://www.instagram.com/bio_mation1" target="_blank" rel="noopener noreferrer" title="Instagram">◎</a>
                <a href="#" title="LinkedIn">in</a>
                <a href="#" title="YouTube">▶</a>
              </div>
            </div>
            <div className="form-card fade-up">
              <form onSubmit={onSubmit}>
                <div className="form-row">
                  <div className="field"><label>First name</label><input name="first_name" required placeholder="Jane" /></div>
                  <div className="field"><label>Last name</label><input name="last_name" required placeholder="Doe" /></div>
                </div>
                <div className="form-row">
                  <div className="field"><label>Email</label><input name="email" required type="email" placeholder="you@example.com" /></div>
                  <div className="field">
                    <label>I'm reaching out about</label>

function App(){
  const hash = useHashRoute();
  const [editMode, setEditMode] = useState(false);

  let page;
  if(hash === "#/" || hash === "" ) page = <Home />;
  else if(hash === "#/about") page = <About />;
  else if(hash === "#/team") page = <Team />;
  else if(hash === "#/projects") page = <Projects initialSlug={null} />;
  else if(hash.startsWith("#/projects/")) page = <Projects initialSlug={hash.replace("#/projects/", "")} />;
  else if(hash === "#/contact") page = <Contact />;
  else page = <Home />;

  return (
    <EditModeContext.Provider value={{ editMode, setEditMode }}>
      <Header />
      <main>{page}</main>
      <Footer />
      <MemberModalHost />
      <ToTop />
      <EditToolbar />
    </EditModeContext.Provider>
  );
}
